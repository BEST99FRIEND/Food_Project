{% extends 'base.html' %}

{% block style %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<style>
  .form-wrap {
    max-width: 820px;
    margin: 50px auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .form-head {
    background: linear-gradient(135deg, #1b0d2b 0%, #2e1748 100%);
    color: #fff;
    padding: 24px 28px;
  }
  .form-body {
    padding: 28px;
  }
  .form-body label {
    font-weight: 600;
  }
  .helptext {
    display: block;
    font-size: 0.85rem;
    color: #6c757d;
    margin-bottom: 10px;
  }
  .action-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
</style>
{% endblock style %}

{% block main %}
<div class="container">
  <div class="form-wrap">
    <div class="form-head">
      <h3 class="mb-1">Mahsulotni tahrirlash</h3>
      <p class="mb-0">Ma'lumotlarni yangilang va saqlang</p>
    </div>
    <div class="form-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="action-row">
          <button type="submit" class="btn btn-primary">Yangilash</button>
          <a href="{% url 'product_detail' product.pk %}" class="btn btn-outline-secondary">Bekor qilish</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock main %}

{% block script %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
{% endblock script %}
