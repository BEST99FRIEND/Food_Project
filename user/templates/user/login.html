<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .login-container {
            width: 350px;
            margin: 100px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #2196F3;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #1976D2;
        }

        .extra {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        .extra a {
            text-decoration: none;
            color: #2196F3;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Kirish</h2>

        {% if messages %}
            {% for message in messages %}
                <div style="margin: 10px 0; padding: 8px 10px; border-radius: 4px; background: #fff3cd; color: #856404; border: 1px solid #ffeeba;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form action="#" method="post"> {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Login</button>

        </form>

        <div class="extra">
            Akkauntingiz yo‘qmi? 
            <a href="{% url 'register' %}">Ro‘yxatdan o‘tish</a>
        </div>

    </div>

</body>
</html>
